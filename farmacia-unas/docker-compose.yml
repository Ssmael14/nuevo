services:
  db:
    image: postgres:16-alpine
    container_name: farmacia_unas_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-farmacia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farmacia}
      POSTGRES_DB: ${POSTGRES_DB:-farmacia_unas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farmacia} -d ${POSTGRES_DB:-farmacia_unas}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - farmacia_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: farmacia_unas_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-farmacia}:${POSTGRES_PASSWORD:-farmacia}@db:5432/${POSTGRES_DB:-farmacia_unas}?schema=public
      JWT_SECRET: ${JWT_SECRET:-cambia_esto_en_produccion}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-cambia_esto_refresh_en_produccion}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - farmacia_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: farmacia_unas_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - farmacia_net

volumes:
  db_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  farmacia_net:
    driver: bridge
