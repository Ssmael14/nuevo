name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./farmacia-unas/backend
    env:
      DATABASE_URL: postgresql://farmacia:farmacia@localhost:5432/farmacia_unas_test?schema=public
      JWT_SECRET: test_secret
      JWT_REFRESH_SECRET: test_refresh_secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: farmacia-unas/backend/package-lock.json
      - run: npm install
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./farmacia-unas/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: farmacia-unas/frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cd farmacia-unas
          cp .env.example .env
          docker compose build
