<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <defs>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="greenBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="mountain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <path id="topArc" d="M 50 70 A 60 60 0 0 1 150 70" fill="none"/>
    <path id="bottomArc" d="M 40 150 A 70 70 0 0 0 160 150" fill="none"/>
  </defs>

  <!-- Outer shield (gold border) -->
  <path d="M 100 6 L 184 30 L 184 130 Q 184 178 100 214 Q 16 178 16 130 L 16 30 Z"
        fill="url(#goldEdge)" stroke="#b45309" stroke-width="1.5"/>

  <!-- Inner green shield band -->
  <path d="M 100 18 L 172 38 L 172 128 Q 172 170 100 200 Q 28 170 28 128 L 28 38 Z"
        fill="url(#greenBand)"/>

  <!-- Inner field (cream/yellow) -->
  <path d="M 100 30 L 160 46 L 160 124 Q 160 162 100 188 Q 40 162 40 124 L 40 46 Z"
        fill="#fef3c7"/>

  <!-- Sky / landscape -->
  <clipPath id="innerClip">
    <path d="M 100 30 L 160 46 L 160 124 Q 160 162 100 188 Q 40 162 40 124 L 40 46 Z"/>
  </clipPath>
  <g clip-path="url(#innerClip)">
    <rect x="40" y="46" width="120" height="80" fill="url(#sky)"/>
    <!-- Mountains -->
    <polygon points="40,120 70,80 95,110 115,75 145,115 160,95 160,140 40,140" fill="url(#mountain)"/>
    <!-- River -->
    <path d="M 40 140 Q 80 135 100 145 Q 120 155 160 145 L 160 160 L 40 160 Z" fill="#86efac"/>
    <!-- Ground -->
    <rect x="40" y="158" width="120" height="40" fill="#bbf7d0"/>
  </g>

  <!-- Sacred fire and book -->
  <circle cx="100" cy="68" r="14" fill="#dc2626" opacity="0.85"/>
  <path d="M 100 56 Q 96 64 100 74 Q 104 64 100 56 Z" fill="#fde047" stroke="#f59e0b" stroke-width="0.7"/>
  <rect x="92" y="75" width="16" height="2" fill="#fff" stroke="#92400e" stroke-width="0.4"/>
  <path d="M 92 75 L 100 78 L 108 75" fill="none" stroke="#92400e" stroke-width="0.6"/>

  <!-- Latin motto -->
  <text x="100" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="5" font-weight="bold" fill="#14532d">
    TERRA VITAEM SUSTINET
  </text>

  <!-- Curved top text "AGRARIA" -->
  <text font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fff" letter-spacing="2">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">AGRARIA</textPath>
  </text>

  <!-- Curved bottom text "UNIVERSIDAD ··· DE LA SELVA" via side arcs -->
  <text font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#fff" letter-spacing="1.5">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">UNIVERSIDAD · DE LA SELVA</textPath>
  </text>
</svg>
